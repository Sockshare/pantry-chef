[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pantry-chef"
version = "2.0.0"
description = "Pantry Chef — Zero-Default Auto-Populating Culinary Alchemist, Substitution Chemistry Lab & Multi-Timer Kitchen Mode"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.6.0",
    "pillow>=10.2.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
include = ["pantry_chef*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
